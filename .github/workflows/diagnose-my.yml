name: Diagnose my.millions.mx

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.MY_DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.MY_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/my_deploy_key
          chmod 600 ~/.ssh/my_deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Collect diagnostics
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.MY_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.MY_DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.MY_DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh_opts="-i ~/.ssh/my_deploy_key -p ${DEPLOY_PORT} -o BatchMode=yes -o StrictHostKeyChecking=yes"
          ssh ${ssh_opts} "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE'
          set -u
          target=/var/www/my.millions.mx/htdocs
          cd "$target" || exit 1

          echo "===== php -v ====="
          php -v 2>&1 | head -2

          echo "===== syntax check of edited files ====="
          for f in app/Console/Kernel.php app/Console/Commands/ApplyMillionsBranding.php \
                   config/common/themes.php config/common/default-settings.php; do
            php -l "$f" 2>&1
          done

          echo "===== today's laravel log (150 lines) ====="
          today=$(date +%Y-%m-%d)
          log="storage/logs/laravel-${today}.log"
          if [ -f "$log" ]; then
            tail -n 150 "$log"
          else
            echo "no $log; logs modified in the last day:"
            find storage/logs -name '*.log' -mtime -1 -printf '%TY-%Tm-%Td %TH:%TM %p\n' 2>/dev/null
            find storage/logs -name '*.log' -mtime -1 -exec tail -n 60 {} +
          fi

          echo "===== permissions / caches ====="
          ls -ld storage storage/logs storage/framework bootstrap/cache public/storage 2>&1
          ls -1 bootstrap/cache 2>&1

          echo "===== aws sdk version ====="
          grep -m1 -A2 '"name": "aws/aws-sdk-php"' vendor/composer/installed.json 2>/dev/null | head -3
          php -r 'require "vendor/autoload.php"; echo "runtime: ", Aws\Sdk::VERSION, "\n";' 2>&1 | tail -1

          echo "===== backblaze rejection message (from logs) ====="
          grep -ho 'Unsupported[^<]*' storage/logs/*.log 2>/dev/null | sort -u | head -5
          grep -ho '<Message>[^<]*' storage/logs/*.log 2>/dev/null | sort -u | head -5

          echo "===== server-side upload test ====="
          cat > /tmp/diag-upload.php <<'PHP'
          <?php
          $app = require __DIR__ . '/../var/www/my.millions.mx/htdocs/bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          try {
              Storage::disk('uploads')->put('diag-test.txt', 'ok');
              echo 'PUT ok: ', var_export(Storage::disk('uploads')->exists('diag-test.txt'), true), "\n";
              Storage::disk('uploads')->delete('diag-test.txt');
              echo "cleanup done\n";
          } catch (\Throwable $e) {
              echo 'FAILED: ', get_class($e), ': ', substr($e->getMessage(), 0, 900), "\n";
          }
          PHP
          php /tmp/diag-upload.php 2>&1 | grep -v Deprecated
          rm -f /tmp/diag-upload.php

          echo "===== dns / outbound connectivity ====="
          cat /etc/resolv.conf 2>&1
          for host in s3.us-east-005.backblazeb2.com api.backblazeb2.com github.com; do
            echo "--- $host"
            getent hosts "$host" || echo "getent: NOT RESOLVED"
            curl -sS -o /dev/null -m 10 -w "curl: %{http_code} (dns %{time_namelookup}s)\n" \
              "https://$host" 2>&1 | head -2
          done

          echo "===== web server error log (tail) ====="
          tail -n 40 /var/log/nginx/error.log 2>/dev/null || \
            tail -n 40 /var/log/apache2/error.log 2>/dev/null || \
            echo "no readable web server log"
          REMOTE
